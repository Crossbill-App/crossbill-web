name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Frontend tests
      - name: Setup Node.js
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm dependencies
        if: matrix.component == 'frontend'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: matrix.component == 'frontend'
        run: npm ci

      - name: Check formatting with Prettier
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: npm run format:check

      - name: Lint with ESLint
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: npm run lint

      - name: Type check with TypeScript
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: npm run type-check

      - name: Build frontend
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: npm run build:ci

      # Backend tests
      - name: Install uv
        if: matrix.component == 'backend'
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        if: matrix.component == 'backend'
        run: uv python install 3.12

      - name: Install dependencies
        if: matrix.component == 'backend'
        working-directory: backend
        run: uv sync

      - name: Check formatting with Ruff
        if: matrix.component == 'backend'
        working-directory: backend
        run: uv run ruff format --check .

      - name: Lint with Ruff
        if: matrix.component == 'backend'
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests with pytest
        if: matrix.component == 'backend'
        working-directory: backend
        env:
          TESTING: "1"
        run: uv run pytest

  release:
    name: Build and Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          # Read current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Split version into parts
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          # Bump version based on input
          case "${{ inputs.version_bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update the root package.json and lockfile
          npm version $NEW_VERSION --no-git-tag-version

          # Update the frontend workspace; npm pkg set leaves its lockfile entry stale
          npm pkg set version=$NEW_VERSION --workspace frontend
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.packages["frontend"].version = process.argv[1];
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
          ' "$NEW_VERSION"

          # Update the docs site, which has its own lockfile
          cd site && npm version $NEW_VERSION --no-git-tag-version && cd ..

          # Update the backend version; anchored so dependency pins stay untouched
          sed -i -E "s|^version = \".*\"|version = \"$NEW_VERSION\"|" backend/pyproject.toml

          # Commit version bump
          git add package.json package-lock.json frontend/package.json \
            site/package.json site/package-lock.json backend/pyproject.toml
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin main

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/crossbill:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/crossbill:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker Image
            ```bash
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/crossbill:v${{ steps.version.outputs.version }}
            ```
          draft: false
          prerelease: false
