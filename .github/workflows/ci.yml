name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        working-directory: frontend
        run: npm run format:check

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

      - name: Check generated API client is current
        working-directory: frontend
        run: |
          npm run api:generate
          git add -N src/api/generated
          git diff --exit-code -- src/api/generated

      - name: Type check with TypeScript
        working-directory: frontend
        run: npm run type-check

      - name: Check for unused files, exports and dependencies with Knip
        working-directory: frontend
        run: npm run knip

      - name: Resolve Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for browser-mode tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build:ci

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with Pyright
        run: uv run pyright

      - name: Check architecture with import-linter
        run: uv run lint-imports

      - name: Check committed OpenAPI schema is current
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

      - name: Run tests with pytest
        env:
          TESTING: "1"
        run: uv run pytest

  # Both stacks in one job: jscpd is a single self-contained binary (installed
  # via the frontend workspace) and each run takes milliseconds, so the npm
  # install dominates and is worth paying for only once.
  duplication:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Check backend duplication
        working-directory: backend
        run: npx jscpd --no-tips

      - name: Check frontend duplication
        working-directory: frontend
        run: npm run duplication
