# Deployment sample config
services:
  postgres:
    # pgvector/pgvector:pgNN is the official Postgres image plus the `vector`
    # extension, required by the semantic-search embeddings table.
    image: pgvector/pgvector:pg18
    container_name: crossbill-postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: crossbill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crossbill_secure_password}
      POSTGRES_DB: crossbill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossbill"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    networks:
      - crossbill-network

  app:
    image: tumetsu/crossbill:latest
    container_name: crossbill-app
    restart: unless-stopped
    pull_policy: always
    # All settings come from .env. Copy .env.example to .env and fill in the
    # required values listed at the top of it.
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      MALLOC_ARENA_MAX: 2 # Prevents libxml2 parsing memory "leak" on epub file processing
      # Points at the postgres service below, replacing the localhost URL in .env.
      DATABASE_URL: postgresql://crossbill:${POSTGRES_PASSWORD:-crossbill_secure_password}@postgres:5432/crossbill
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: 8000
    volumes:
      # Book files are stored here unless S3 storage is configured in .env.
      # Change the source to a folder on your host.
      - type: bind
        source: /path/on/host/for/crossbill/book-files
        target: /app/book-files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crossbill-network

  # Separate background worker (SAQ).
  #
  # NOT NEEDED by default: the app runs the worker in its own process
  # (EMBEDDED_WORKER=true). To run the worker in its own container instead,
  # uncomment this service and set EMBEDDED_WORKER=false in .env.
  #
  # worker:
  #   image: tumetsu/crossbill:latest
  #   container_name: crossbill-worker
  #   restart: unless-stopped
  #   pull_policy: always
  #   env_file: .env
  #   command: ["saq", "src.worker.worker_settings"]
  #   environment:
  #     DATABASE_URL: postgresql://crossbill:${POSTGRES_PASSWORD:-crossbill_secure_password}@postgres:5432/crossbill
  #     ENVIRONMENT: ${ENVIRONMENT:-production}
  #   volumes:
  #     - type: bind
  #       source: /path/on/host/for/crossbill/book-files
  #       target: /app/book-files
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - crossbill-network

  # Optional S3-compatible storage. Starts only when named:
  #   docker compose up -d garage
  # Not needed if you use an external S3 service (e.g. Railway Object Storage, AWS S3).
  garage:
    image: dxflrs/garage:v2.2.0
    profiles: ["s3"]
    container_name: crossbill-garage
    restart: unless-stopped
    ports:
      - "3900:3900"  # S3 API
      - "3902:3902"  # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    networks:
      - crossbill-network

volumes:
  postgres_data:
    driver: local
  garage_data:
    driver: local
  garage_meta:
    driver: local

networks:
  crossbill-network:
    driver: bridge
